name: CI - Code Check

# This pipeline runs automatically on every push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the latest code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Check that every Python file compiles without syntax errors
      - name: Check for syntax errors
        run: |
          python -m py_compile bot_engine.py
          python -m py_compile chatbot_gemini_memory.py
          python -m py_compile chatbot_ui.py

      # Step 5: (Optional) Lint the code for style issues
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
